<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="logo">
            <img src="../../assets/logo.webp" alt="logo">
        </div>
        <ul>
            <li>Home</li>
            <li>About Us</li>
            <li>Contact Us</li>
            <li>Services</li>
            <li>FAQs</li>
        </ul>
        <div class="book-now">
            <button>Book Now</button>
        </div>
    </nav>

    <div class="banner"><img src="../../assets/banner-1.webp" alt="banner"></div>

    <div class="search-wrapper">
        <div class="search-bar">
            <input type="text" placeholder="Enter Your Meal...">
            <div class="arrow-icon">
                <img src="../../assets/icons/arrow.svg" alt="">
            </div>
        </div>
    </div>


    <div class="body">
        <div class="loading-card">
            <div class="animation-ball"></div>
        </div>
        <div class="card">
            <p class="title">The OG Smash</p>
            <div class="item"><img src="../../assets/items/burger-1.webp" alt="OG Smash Burger"></div>
            <p class="rate">from <del> Rs. 850</del> <ins> Rs. 273 </ins></p>
        </div>
    </div>

</html>
